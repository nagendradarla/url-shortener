name: Quality gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  constitution-gates:
    name: compile-test-sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: JUnit (constitution I)
        run: mvn -B test
      - name: SAST (constitution II)
        run: mvn -B exec:java -Dexec.mainClass=com.example.shortener.sast.SastScanner -Dexec.classpathScope=compile -Dexec.args="src/main/java"
      - name: Upload HITL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-reports
          path: |
            hitl/
            agentic_loop_log.md
          if-no-files-found: ignore
